name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode must increase monotonically or Android refuses to install over the top.
          # Commit count is monotonic and needs no manual bookkeeping.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > tradenotify-release.jks
          cat > keystore.properties <<EOF
          storeFile=tradenotify-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK after its version
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             TradeNotify-${{ steps.version.outputs.name }}.apk

      - name: Remove signing material from the runner
        if: always()
        run: rm -f tradenotify-release.jks keystore.properties

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TradeNotify ${{ steps.version.outputs.name }}
          files: TradeNotify-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          body: |
            ## Install

            1. Download the APK below on your Android phone.
            2. Open it. Android will ask to allow installs from your browser — allow it.
            3. If you see **"Unsafe app blocked"** from Play Protect, tap **More details → Install anyway**. That warning appears for every app not distributed through the Play Store.
            4. Open TradeNotify and follow the setup wizard.

            Installing over an existing copy keeps your rules and history.
